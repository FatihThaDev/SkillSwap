<section class="mt-8 px-4">
  <h1 class="mb-6 text-2xl sm:text-3xl text-center font-bold">Explore Available Courses</h1>

  <div id="create-course-section" class="mb-8 max-w-4xl mx-auto p-4 border border-gray-200 rounded-lg bg-gray-800" style="display: none;">
    <h2 class="text-xl font-bold mb-4">Create New Course</h2>
    <form id="create-course-form">
      <div class="mb-4">
        <label class="block text-gray-300 mb-2">Title</label>
        <input type="text" name="title" required class="w-full bg-gray-700 border-2 border-blue-400 border-dashed rounded-md p-2">
      </div>
      <div class="mb-4">
        <label class="block text-gray-300 mb-2">Description</label>
        <textarea name="description" required class="w-full bg-gray-700 border-2 border-blue-400 border-dashed rounded-md p-2"></textarea>
      </div>
      <div class="mb-4">
        <label class="block text-gray-300 mb-2">Category</label>
        <select name="category_id" id="create-course-category" required class="w-full bg-gray-700 border-2 border-blue-400 border-dashed rounded-md p-2">
          <option value="">Select Category</option>
        </select>
      </div>
      <div class="flex gap-4">
        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded-md">Create Course</button>
        <button type="button" id="cancel-create-course" class="bg-gray-600 hover:bg-gray-700 text-white py-2 px-6 rounded-md">Cancel</button>
      </div>
    </form>
  </div>

  <div class="mb-8 max-w-4xl mx-auto p-4 border border-gray-200 rounded-lg bg-gray-800">
    <div class="flex flex-col md:flex-row gap-4 items-center">
      <input type="text" id="course-search" placeholder="Search courses..."
        class="w-full bg-gray-700 border-2 border-blue-400 border-dashed rounded-md p-2">
      <select id="category-filter" class="bg-gray-700 border-2 border-blue-400 border-dashed rounded-md p-2">
        <option value="">All Categories</option>
      </select>
      <button id="show-create-course" class="bg-green-500 hover:bg-green-600 text-white py-2 px-6 rounded-md" style="display: none;">Create Course</button>
    </div>
  </div>

  <div id="courses-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  </div>
</section>
